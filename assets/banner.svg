<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 360"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0f172a"/><stop offset="50%" stop-color="#1e1b4b"/><stop offset="100%" stop-color="#0f172a"/></linearGradient><linearGradient id="textGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="glowGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#06b6d4" stop-opacity=".25"/><stop offset="100%" stop-color="#9333ea" stop-opacity="0"/></linearGradient><filter id="shadow" width="120%" height="120%" x="-10%" y="-10%"><feDropShadow dx="0" dy="4" flood-color="#000" flood-opacity=".6" stdDeviation="6"/></filter></defs><style>@keyframes pulse{0%{transform:scale(.95);opacity:.2}}@keyframes float{0%{transform:translateY(0) rotate(0deg)}}.bg{fill:url(#bgGrad)}.subtitle,.tag,.title{font-family:system-ui,-apple-system,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.title{font-weight:900;font-size:52px;fill:url(#textGrad)}.subtitle{font-weight:500;font-size:20px;fill:#e2e8f0}.tag{font-weight:600;font-size:14px;fill:#38bdf8}.pulse-circle{animation:pulse 6s ease-in-out infinite alternate}.float-grid{animation:float 8s ease-in-out infinite alternate}.wave-line{stroke-dasharray:10 15;animation:dash 30s linear infinite}</style><rect width="1200" height="360" class="bg" rx="16"/><g class="pulse-circle" transform-origin="600 180"><circle cx="1000" cy="80" r="220" fill="url(#glowGrad)"/><circle cx="150" cy="300" r="180" fill="url(#glowGrad)"/></g><path fill="none" stroke="#6366f1" stroke-width="2" d="M -100 280 Q 300 340 600 240 T 1300 200" class="wave-line" opacity=".4"/><path fill="none" stroke="#0ea5e9" stroke-width="1.5" d="M -100 290 Q 300 200 600 280 T 1300 180" class="wave-line" opacity=".3"/><g stroke="#fff" stroke-width=".5"