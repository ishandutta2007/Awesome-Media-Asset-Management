<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#9333ea" stop-opacity="0.0" />
    </linearGradient>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <style>
    .bg { fill: url(#bgGrad); }
    .title {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 900;
      font-size: 52px;
      fill: url(#textGrad);
    }
    .subtitle {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 20px;
      fill: #e2e8f0;
    }
    .tag {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 14px;
      fill: #38bdf8;
    }
    
    /* Dynamic Animated Background Elements */
    .pulse-circle {
      animation: pulse 6s ease-in-out infinite alternate;
    }
    .float-grid {
      animation: float 8s ease-in-out infinite alternate;
    }
    .wave-line {
      stroke-dasharray: 10 15;
      animation: dash 30s linear infinite;
    }

    @keyframes pulse {
      0% { transform: scale(0.95); opacity: 0.2; }
      100% { transform: scale(1.05); opacity: 0.45; }
    }
    @keyframes float {
      0% { transform: translateY(0px) rotate(0deg); }
      100% { transform: translateY(-12px) rotate(3deg); }
    }
    @keyframes dash {
      to { stroke-dashoffset: -1000; }
    }
  </style>

  <!-- Background -->
  <rect width="1200" height="360" class="bg" rx="16" />
  
  <!-- Dynamic Background Geometric Shapes (In Background Layer) -->
  <g class="pulse-circle" transform-origin="600 180">
    <circle cx="1000" cy="80" r="220" fill="url(#glowGrad)" />
    <circle cx="150" cy="300" r="180" fill="url(#glowGrad)" />
  </g>

  <!-- Animated Tech Wave Line -->
  <path class="wave-line" d="M -100 280 Q 300 340 600 240 T 1300 200" fill="none" stroke="#6366f1" stroke-width="2" opacity="0.4" />
  <path class="wave-line" d="M -100 290 Q 300 200 600 280 T 1300 180" fill="none" stroke="#0ea5e9" stroke-width="1.5" opacity="0.3" />

  <!-- Grid overlay in background -->
  <g class="float-grid" stroke="#ffffff" stroke-width="0.5" opacity="0.07">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="200" y1="0" x2="200" y2="360" />
    <line x1="400" y1="0" x2="400" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="800" y1="0" x2="800" y2="360" />
    <line x1="1000" y1="0" x2="1000" y2="360" />
  </g>

  <!-- Decorative Media Cards / Icons background visuals -->
  <g transform="translate(920, 100)" opacity="0.85" filter="url(#shadow)">
    <rect width="180" height="120" rx="12" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <polygon points="75,45 115,60 75,75" fill="#38bdf8"/>
    <rect x="20" y="92" width="140" height="6" rx="3" fill="#334155"/>
    <rect x="20" y="92" width="80" height="6" rx="3" fill="#818cf8"/>
  </g>

  <!-- Foreground Content (Guaranteed foreground visibility) -->
  <g filter="url(#shadow)" transform="translate(80, 0)">
    <!-- Badge Pill -->
    <g transform="translate(0, 72)">
      <rect width="280" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
      <text x="140" y="21" text-anchor="middle" class="tag">🎬 CURATED AWESOME LIST</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="165" class="title">Awesome Media Asset Management</text>

    <!-- Subtitle -->
    <text x="0" y="215" class="subtitle">A premier collection of enterprise SaaS &amp; top open-source MAM / DAM platforms</text>

    <!-- Stat/Highlight Pills -->
    <g transform="translate(0, 255)">
      <rect x="0" y="0" width="170" height="36" rx="8" fill="#0f172a" stroke="#334155" />
      <text x="85" y="23" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#94a3b8">⚡ Open-Source MAM</text>

      <rect x="185" y="0" width="170" height="36" rx="8" fill="#0f172a" stroke="#334155" />
      <text x="270" y="23" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#94a3b8">☁️ Enterprise SaaS</text>

      <rect x="370" y="0" width="180" height="36" rx="8" fill="#0f172a" stroke="#334155" />
      <text x="460" y="23" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#94a3b8">📊 Market Insights</text>
    </g>
  </g>
</svg>
